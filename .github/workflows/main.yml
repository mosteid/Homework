name: Build Homework Tracker Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Locate Android project folder
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "PROJ_DIR=." >> $GITHUB_ENV
          elif [ -f "HomeworkTrackerAndroid/settings.gradle.kts" ]; then
            echo "PROJ_DIR=HomeworkTrackerAndroid" >> $GITHUB_ENV
          else
            echo "Error: Could not find settings.gradle.kts"
            ls -la
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle Arabic OCR Model (ara.traineddata)
        run: |
          mkdir -p "$PROJ_DIR/app/src/main/assets/tessdata"
          curl -fL -o "$PROJ_DIR/app/src/main/assets/tessdata/ara.traineddata" \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata

      - name: Build Debug APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeworkTracker3D-Android-APK
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/app-debug.apk
